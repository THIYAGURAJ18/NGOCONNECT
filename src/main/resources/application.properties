# ============================================================
# NGO Connect - Application Properties
# ============================================================

# Server
server.port=8080

# ============================================================
# H2 Database (File Mode - data persists between restarts)
# ============================================================
spring.datasource.url=jdbc:h2:file:./data/ngoconnect;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (useful for debugging data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# To switch to MySQL: comment out H2 section above, uncomment below
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/ngoconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ============================================================
# File Upload Settings
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory (relative to working directory)
app.upload.dir=uploads

# ============================================================
# Session Settings
# ============================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ============================================================
# Logging
# ============================================================
logging.level.com.ngoconnect=INFO
logging.level.org.springframework.security=WARN

# ============================================================
# Razorpay Payment Gateway Configuration
# ============================================================
# Get your API Keys from Razorpay Dashboard: https://dashboard.razorpay.com/app/keys
# You can also set system environment variables RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret_placeholder}
razorpay.currency=INR
razorpay.company.name=Smart Donation & NGO Connect
